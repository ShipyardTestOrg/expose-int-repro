services:
  web:
    build: .
    labels:
      shipyard.route: '/'
    ports:
      - "8080:8080"
    # Quoted -- parses as strings, which is what the frontend expects.
    expose:
      - "9090"
      - "9091"
    volumes:
      # Short syntax, and long syntax *with* a source. Both already worked.
      - type: volume
        source: scratch
        target: /var/lib/scratch

volumes:
  scratch:
