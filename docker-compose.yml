services:
  web:
    build: .
    labels:
      shipyard.route: '/'
    ports:
      # Passes Shipyard's compose validation, then raises
      # ShipyardException('Invalid port "8080:notaport"') inside
      # ComposeService.ports -- the exact failure the configure endpoint
      # used to swallow into an empty service list with no trace anywhere.
      - "8080:notaport"
