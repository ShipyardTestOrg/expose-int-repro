services:
  web:
    build: .
    labels:
      shipyard.route: '/'
    ports:
      - "8080:8080"
    volumes:
      # `source` is optional in the compose long syntax. A tmpfs mount and an
      # anonymous volume both have a target only -- which used to raise
      # KeyError('source') and 500 the git-provider compose endpoint.
      - type: tmpfs
        target: /tmp
      - type: volume
        target: /var/lib/scratch
